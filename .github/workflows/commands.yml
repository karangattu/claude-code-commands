name: Issue Commands

on:
  issue_comment:
    types: [created]

permissions: read-all

jobs:
  triage:
    if: >-
      ${{
        !github.event.issue.pull_request &&
        (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') &&
        (
          github.event.comment.body == '/triage' ||
          startsWith(github.event.comment.body, '/triage ')
        )
      }}
    name: Triage Issue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: issue-command-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: React to the command
        run: |
          gh api --method POST "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='eyes' --silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 25
            --allowedTools "Bash,Read"
          prompt: |
            You are triaging GitHub issue #${{ github.event.issue.number }} in the ${{ github.repository }} repository.
            Do not modify repository files, issue title, issue body, labels, milestones, assignees, or project metadata.
            Please perform the following actions:
            1. Analyze the issue context and body.
            2. Read the codebase to understand the affected components.
            3. Determine if the issue is a bug, feature request, or question, and list missing information if any.
            4. Post one comment on the issue with a summary of your findings, suggested labels, and recommended next actions.

  reprex:
    if: >-
      ${{
        !github.event.issue.pull_request &&
        (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') &&
        (
          github.event.comment.body == '/reprex' ||
          startsWith(github.event.comment.body, '/reprex ')
        )
      }}
    name: Reproduce Issue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: issue-command-reprex-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: React to the command
        run: |
          gh api --method POST "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='eyes' --silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 25
            --allowedTools "Bash,Read"
          prompt: |
            You are tasked with reproducing GitHub issue #${{ github.event.issue.number }} in the ${{ github.repository }} repository on this Linux runner.
            Do not modify repository files, issue title, issue body, labels, milestones, assignees, or project metadata.
            Please perform the following actions:
            1. Analyze the issue context and body to identify reproduction steps.
            2. Read the repository codebase to find the relevant code/tests.
            3. Construct and run a minimal reproduction command or script in the Linux environment.
            4. Post one comment on the issue with whether the issue was reproduced, relevant logs/output, and any insights gained.

  duplicate:
    if: >-
      ${{
        !github.event.issue.pull_request &&
        (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') &&
        (
          github.event.comment.body == '/duplicate' ||
          startsWith(github.event.comment.body, '/duplicate ')
        )
      }}
    name: Find Duplicates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: issue-command-duplicate-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: React to the command
        run: |
          gh api --method POST "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='eyes' --silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 25
            --allowedTools "Bash,Read"
          prompt: |
            You are searching for duplicate or similar issues to issue #${{ github.event.issue.number }} in the ${{ github.repository }} repository.
            Do not modify repository files, issue title, issue body, labels, milestones, assignees, or project metadata.
            Please perform the following actions:
            1. Retrieve open and closed issues using the GitHub API or CLI.
            2. Match titles, descriptions, and keywords of issue #${{ github.event.issue.number }} against other issues in the repository.
            3. Post one comment on issue #${{ github.event.issue.number }} listing any potentially duplicate or highly related issues, with brief explanations of why they match. If no duplicates are found, explicitly state that in your comment.

  issue-fix:
    if: >-
      ${{
        !github.event.issue.pull_request &&
        (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') &&
        (
          github.event.comment.body == '/issue-fix' ||
          startsWith(github.event.comment.body, '/issue-fix ')
        )
      }}
    name: Fix Issue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-command-issue-fix-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: React to the command
        run: |
          gh api --method POST "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='rocket' --silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - uses: actions/checkout@v6.0.3

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 40
            --allowedTools "Bash,Read,Write,Edit"
          prompt: |
            You are fixing GitHub issue #${{ github.event.issue.number }} in the ${{ github.repository }} repository.
            Please perform the following actions:
            1. Analyze the issue details and the codebase.
            2. Design and implement a minimal, correct solution to fix the issue.
            3. Run the existing tests with `python3 -m unittest discover -s tests` and run any relevant linting commands documented by the repository.
            4. Create a new git branch, commit your changes, push to the origin repository, and create a Pull Request referencing the issue.
            5. If a Pull Request cannot be created, post a detailed comment with the suggested fix/patch.
