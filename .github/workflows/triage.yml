on:
  issue_comment:
    types: [created]

name: Triage Issue

permissions: read-all

jobs:
  triage:
    if: ${{ !github.event.issue.pull_request && (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') && startsWith(github.event.comment.body, '/triage') }}
    name: Triage Issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: React to the command
        run: |
          gh api --method POST "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='eyes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - uses: actions/checkout@v6.0.3

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 40
            --allowedTools "Bash,Read,Write,Edit"
          prompt: |
            You are triaging GitHub issue #${{ github.event.issue.number }} in the ${{ github.repository }} repository.
            Please perform the following actions:
            1. Analyze the issue context and body.
            2. Read the codebase to understand the affected components.
            3. Determine if the issue is a bug, feature request, or question, and list missing information if any.
            4. Post a summary of your findings to the issue, suggest appropriate labels, and recommend next actions.
