on:
  issue_comment:
    types: [created]

name: Reproduce Issue (Reprex)

permissions: read-all

jobs:
  reprex:
    if: ${{ !github.event.issue.pull_request && (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') && startsWith(github.event.comment.body, '/reprex') }}
    name: Reproduce Issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: React to the command
        run: |
          gh api --method POST "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='eyes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - uses: actions/checkout@v6.0.3

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 40
            --allowedTools "Bash,Read,Write,Edit"
          prompt: |
            You are tasked with reproducing GitHub issue #${{ github.event.issue.number }} in the ${{ github.repository }} repository on this Linux runner.
            Please perform the following actions:
            1. Analyze the issue context and body to identify reproduction steps.
            2. Research the repository codebase to find the relevant code/tests.
            3. Construct a minimal reproduction script or environment to reproduce the bug or behavior.
            4. Run the reproduction steps/script in the Linux environment.
            5. Post a comment on the issue with the results: whether the issue was successfully reproduced, logs/output of the reproduction attempt, and any insights gained.
