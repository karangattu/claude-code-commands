on:
  issue_comment:
    types: [created]

name: Fix Issue

permissions: read-all

jobs:
  issue-fix:
    if: ${{ !github.event.issue.pull_request && (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') && startsWith(github.event.comment.body, '/issue-fix') }}
    name: Fix Issue
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: React to the command
        run: |
          gh api --method POST "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='rocket'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 40
            --allowedTools "Bash,Read,Write,Edit"
          prompt: |
            You are fixing GitHub issue #${{ github.event.issue.number }} in the ${{ github.repository }} repository.
            Please perform the following actions:
            1. Analyze the issue details and the codebase.
            2. Design and implement a minimal, correct solution to fix the issue.
            3. Run linting and existing tests to verify your implementation.
            4. Create a new git branch, commit your changes, push to the origin repository, and create a Pull Request referencing the issue.
            5. If a Pull Request cannot be created, post a detailed comment with the suggested fix/patch.
