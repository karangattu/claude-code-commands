on:
  issue_comment:
    types: [created]

name: Find Duplicate Issues

permissions: read-all

jobs:
  duplicate:
    if: ${{ !github.event.issue.pull_request && (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') && startsWith(github.event.comment.body, '/duplicate') }}
    name: Find Duplicates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: React to the command
        run: |
          gh api --method POST "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='eyes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - uses: actions/checkout@v6.0.3

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 40
            --allowedTools "Bash,Read,Write,Edit"
          prompt: |
            You are searching for duplicate or similar issues to issue #${{ github.event.issue.number }} in the ${{ github.repository }} repository.
            Please perform the following actions:
            1. Retrieve open and closed issues using the GitHub API or CLI.
            2. Match titles, descriptions, and keywords of issue #${{ github.event.issue.number }} against other issues in the repository.
            3. Post a comment on issue #${{ github.event.issue.number }} listing any potentially duplicate or highly related issues, with brief explanations of why they match. If no duplicates are found, explicitly state that in your comment.
